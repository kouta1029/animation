name: Validate Codex multi-agent configuration

on:
  pull_request:
    paths: &agent_paths
      - ".codex/**"
      - "docs/decisions.md"
      - "docs/series_bible.md"
      - "docs/production_rules.md"
      - "docs/roles/**"
      - "docs/agent_orchestration.md"
      - "docs/prompts/**"
      - "tools/validate_codex_agents.py"
      - "tests/test_codex_agents.py"
      - ".github/workflows/validate-codex-agents.yml"
  push:
    branches: [main]
    paths: *agent_paths

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate TOML and required docs
        run: python tools/validate_codex_agents.py
      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
